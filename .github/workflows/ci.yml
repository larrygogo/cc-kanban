name: CI
on:
  push:
    branches: [main]
  pull_request:
  # e2e job 只在 main 与手动触发上跑（见该 job 的 if）；这里开 dispatch 是为了改完
  # E2E 相关代码后能立刻验一把，不必先合进 main 再等。
  workflow_dispatch:
# CI 只读代码，不需要写权限（deploy-pages/release 各自显式声明了自己的）。
permissions:
  contents: read
# 同一 PR 连推多次时取消进行中的旧 run（windows+macos 双矩阵，白跑很贵）；
# main 上的 push 不取消，保证每个合并点都有完整结论。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    # 冷缓存 + macOS 全量编译约 15-25 分钟；默认 360 分钟的兜底只会烧配额。
    timeout-minutes: 60
    steps:
      # 第三方 action 一律 pin 到完整 commit SHA：tag 可被重新指向，等于让别人的仓库
      # 对我们的 CI 有持续写权限（CI 能读代码、能拿 GITHUB_TOKEN）。release.yml 早已
      # 这么做，这里补齐——同一仓库两套标准比两边都不 pin 更糟：会让人以为已经防住了。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: 安装 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # setup-bun 只缓存 bun 二进制，不缓存包下载：没有这层缓存时每次 bun install
      # 都全量走网络。key 按 lockfile 内容滚动。
      - name: Bun 包缓存
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
      # 不带 @stable：rustc/clippy 版本由 app/src-tauri/rust-toolchain.toml 固定，
      # 本地与 CI 必须同一版本（否则 -D warnings 下的 lint 集漂移 = 「在我机器上是好的」）。
      # components 也在那个文件里声明，这里不再重复。
      - name: 安装 Rust(版本见 rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable(仅取 action 实现)
        with:
          toolchain: "1.97.1"
          components: clippy
      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # workspace 根在 app/src-tauri（全部 Rust 都住那里），target/ 也在它下面。
          workspaces: app/src-tauri
          # 默认只在 job 成功时落盘缓存——而「PR 上连续修 lint」恰恰是连续失败的场景，
          # 不开这个每推一次都从零编译整个依赖树。
          cache-on-failure: true
      - name: 生成并校验前后端 IPC 契约
        working-directory: app/src-tauri
        # meowo-agent / meowo-store 的 --lib 也在导出（AgentDescriptor / ChatUi 一族、
        # LiveSession / Session 等，见 docs/architecture/consistency-backlog.md P1-1）；
        # 集成测试不参与导出，不必跑。
        run: cargo test -p meowo-protocol -p meowo-agent -p meowo-store --lib && git diff --exit-code -- ../src/generated/contracts
      - name: 安装前端依赖
        working-directory: app
        run: bun install --frozen-lockfile
      - name: 前端单测
        working-directory: app
        run: bunx vitest run
      - name: 构建前端(tsc + vite build)
        working-directory: app
        run: bun run build
      # tauri.conf.json 的 resources 还打包移动端页面(../dist-mobile),同样在编译期校验。
      # 该产物由 beforeBuildCommand 的 build:mobile 产出;测试/clippy 不走那个钩子,这里补跑。
      - name: 构建移动端页面(dist-mobile)
        working-directory: app
        run: bun run build:mobile
      # tauri_build 在编译期校验 externalBin 文件存在，编译 meowo-app 前必须先备好 sidecar
      - name: 准备 meowo-reporter sidecar
        run: bun scripts/prepare-sidecar.mjs
      # 同理：tauri.windows.conf.json 的 resources（打包的 ConPTY）也在编译期校验。
      # 打包路径由 beforeBuildCommand 自动获取；测试/clippy 不走那个钩子，这里补跑。
      # 非 Windows 平台脚本自跳过；哈希命中时不重复下载。
      - name: 准备打包版 ConPTY
        run: bun scripts/fetch-conpty.mjs
      - name: Rust 测试
        working-directory: app/src-tauri
        run: cargo test --workspace
      # --all-targets 覆盖测试/示例代码：不带它时 #[cfg(test)] 里的 lint 完全不检查，
      # 而本地开发普遍带（本地比 CI 严 = CI 门禁形同虚设）。matrix 含 macos-latest，
      # macOS 专属模块（src/macos/**）**只有**在这里才被编译——Windows 开发机无法交叉
      # 验证它（objc2 要编译 Objective-C，需 macOS SDK；实测不可行），改那些文件后
      # 必须靠这条 CI 兜底，本地全绿不代表它们能编译。
      - name: Rust clippy
        working-directory: app/src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

  # 依赖漏洞审计：第三方 crate / npm 包出现已知 CVE 时给出门禁/告警。
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: 安装 cargo-audit
        # pin 到 v2 的 SHA，工具名走 `tool` 输入（原先的 @cargo-audit 是可变分支引用）。
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-audit
      - name: Rust 依赖漏洞审计 (cargo audit)
        # 直接调用 cargo audit：仅在出现「漏洞(vulnerabilities)」时失败；unmaintained/unsound
        # 等 informational 告警不阻断（多为无法立即修的传递依赖）。
        # 不用 rustsec/audit-check action——它在 push 事件需 Checks API 写权限，
        # 而默认 GITHUB_TOKEN 只读 → 报「Resource not accessible by integration」。
        # Cargo.lock 与 .cargo/audit.toml 都随 workspace 住在 app/src-tauri 下。
        working-directory: app/src-tauri
        run: cargo audit
      - name: 安装 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: 前端依赖漏洞审计 (bun audit)
        working-directory: app
        # npm 生态常有无法立即修的传递性低危告警，先告警不阻断（continue-on-error）。
        continue-on-error: true
        run: bun install --frozen-lockfile && bun audit

  # E2E：拉起真实的 app 二进制，用 WDIO 驱动 WebView2 走一遍看板刷新。
  #
  # **为什么不并进上面的 check 矩阵**，三条各自独立：
  #  1. 它要 Node 22——WDIO 的 webdriver 手动设 Content-Length/Connection 头，Node ≥26 的
  #     undici v8 按 Fetch 规范拒收（webdriverio#15265），e2e/run.mjs 有预检直接拒跑。
  #     check job 用的是 runner 自带的 Node，两者要的版本不同，混在一个 job 里互相打架。
  #  2. 它要一次完整的 debug 版 tauri 构建（--features e2e + 前端 + dist-mobile），
  #     十几分钟起步，而目前只有一个 spec（board-refresh）——挂在每个 PR 上性价比不成立。
  #  3. wdio.conf 走 msedgedriver（Windows 的 WebView2 内核），macOS 侧未验证，不进矩阵。
  #
  # 所以它的定位是**防烂**而不是防 PR 回归：整套 E2E 基建（run.mjs / wdio.conf /
  # --features e2e / tauri.e2e.conf.json / wdio capability）此前从未在 CI 跑过一次，
  # 不接一条定期通道，它迟早在某次重构里悄悄失效，等真要用时才发现起不来。
  # 因此只在 push main 与手动触发时跑，PR 上不跑、也就永远不会挡合并。
  e2e:
    # PR 上不跑：跑也不挡合并，白烧十几分钟配额。
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    # 冷缓存下 debug 全量编译 + 首次下载 msedgedriver 约 20-35 分钟。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Node 22 LTS：理由见上方 1.。钉死大版本而不是 latest——预检拒的正是"太新"。
      - name: 安装 Node 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: 安装 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Bun 包缓存
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
      - name: 安装 Rust(版本见 rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable(仅取 action 实现)
        with:
          toolchain: "1.97.1"
      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: app/src-tauri
          # 与 check job 分开的 key：那边是 cargo check/clippy 的产物，这边是
          # `--features e2e` 的 debug 二进制，profile 与 feature 都不同，混用只会互相顶掉。
          key: e2e
          cache-on-failure: true
      - name: 安装前端依赖
        working-directory: app
        run: bun install --frozen-lockfile
      # 直接调 node（而非 bun run test:e2e）：run.mjs 用 process.execPath 跑 wdio 本体，
      # 入口进程是谁决定了 wdio 跑在哪个运行时上——bun 的 fetch 与 Node≥26 的 undici
      # 同样拒收那两个头，用 bun 当入口等于绕过刚装好的 Node 22。
      # tauri build 的 beforeBuildCommand 已包含 sidecar/ConPTY/前端/dist-mobile 四步，
      # 不必像 check job 那样手工补跑。
      - name: E2E(WDIO + 真实 app 二进制)
        working-directory: app
        run: node e2e/run.mjs
