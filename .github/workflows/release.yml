name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      # latest.json 由 tauri-action 按「读取 release 上已有内容 → 合并本平台 → 上传」生成，
      # 两个平台 job 并行时该窗口可能重叠，后写覆盖先写 → 只剩单平台的 latest.json，
      # 另一平台自动更新静默失效。串行化消除竞态（发版频率低，代价可接受）。
      max-parallel: 1
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    # macOS 公证偶发挂起，默认 360 分钟会烧满账单额度才失败——公证正常十几分钟内完成。
    timeout-minutes: 90
    steps:
      # 本 workflow 持有签名证书与 minisign 私钥，第三方 action 一律 pin 完整 SHA（同 ci.yml）。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # 推错 tag（代码版本与 tag 不符）会静默产出版本号错误的安装包 + latest.json，
      # 自动更新器随后陷入「下载了却还提示有新版」的循环。Cargo.toml 是版本唯一真源
      # （tauri.conf.json 无 version 字段），在花钱构建前先拦下。
      - name: 校验 tag 与 Cargo.toml 版本一致
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' app/src-tauri/Cargo.toml | head -n1)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag 与 app/src-tauri/Cargo.toml 的 version=$version 不一致，先对齐版本再重新打 tag"
            exit 1
          fi

      - name: 安装 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Bun 包缓存
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}

      # toolchain 必须与 rust-toolchain.toml 一致。这个 action 的 toolchain 输入默认是
      # `stable`(不随 pin 的 SHA 变)，不传就把 target 装到 stable 上；而 cargo 在
      # app/src-tauri 下跑时 rustup 按 rust-toolchain.toml 切到固定版本，那上面没有这两个
      # target——0.5.10 首次发布即栽在这里:E0463 can't find crate for `core`。
      - name: 安装 Rust(版本见 rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable(仅取 action 实现)
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # workspace 根在 app/src-tauri（全部 Rust 都住那里），target/ 也在它下面。
          workspaces: app/src-tauri
          # 失败的 run 也落盘缓存：发布失败重试时不必从零编译（理由同 ci.yml）。
          cache-on-failure: true

      - name: 安装前端依赖
        working-directory: app
        run: bun install --frozen-lockfile

      # Windows 由 beforeBuildCommand 里的 prepare-sidecar.mjs 覆盖（宿主 triple）；
      # macOS 是 universal 构建，需要双架构 lipo 合并的 sidecar，提前显式准备。
      - name: 准备 meowo-reporter sidecar (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: bun scripts/prepare-sidecar.mjs --universal

      - name: 构建并发布(签名公证 + 自动更新产物)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自动更新（minisign，复用现有密钥）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 代码签名（CI 自动建临时 keychain）
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # macOS 公证（Apple ID + App 专用密码，tauri-action 直接支持，无需 .p8 落盘）
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Meowo ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # WebView2 壳安装器（人类下载入口）：wry 现代 UI 包着 NSIS 芯静默跑。
      # 必须在 tauri-action 之后——壳的 build.rs 要 include_bytes! 嵌入 NSIS 产物。
      # updater 链路不经过壳：latest.json 仍指向 -setup.exe（NSIS 芯），零影响；
      # 官网下载页（site/lib/release.ts）优先取 -installer.exe。
      - name: 构建并上传 WebView2 安装器壳 (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          inner="app/src-tauri/target/release/bundle/nsis/Meowo_${ver}_x64-setup.exe"
          if [ ! -f "$inner" ]; then
            echo "::error::NSIS 产物不存在: $inner"
            exit 1
          fi
          export MEOWO_INNER_SETUP="$(cygpath -m "$PWD/$inner")"
          (cd app/src-tauri && cargo build --release -p meowo-setup)
          out="Meowo_${ver}_x64-installer.exe"
          cp app/src-tauri/target/release/meowo-setup.exe "$out"
          # draft release 可按 tag 名寻址；--clobber 让失败重试幂等。
          gh release upload "$GITHUB_REF_NAME" "$out" --clobber
