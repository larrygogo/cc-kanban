# Pages 部署：需在 Settings → Pages → Source 选 "GitHub Actions"（一次性）。
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  # 发版后也要重新部署（下载直链与更新日志是构建时从 GitHub API 取的，不重建就还是旧版本），
  # 但不能在这里挂 release 触发：那样 workflow 跑在 tag ref 上，而 github-pages
  # environment 只允许 main 部署，deploy job 会被直接拒掉。改由 site-redeploy.yml
  # 在 release 发布后 dispatch 本 workflow（跑在 main 上）。
  workflow_dispatch:

# 允许该 workflow 发布到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个部署；新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      # 本 workflow 持有 pages:write + id-token:write，第三方 action 一律 pin 完整 SHA（同 ci.yml）。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Bun 包缓存
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-site-${{ hashFiles('site/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        run: bun run build
        env:
          NEXT_PUBLIC_SITE_URL: https://meowo.io
          # 构建时要读 releases/latest 拿安装包直链，带 token 避开匿名 API 限额。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        # 尝试自动为仓库启用 Pages（源=GitHub Actions），省去手动去 Settings 开启。
        # 若因权限无法自动启用，则需手动：Settings → Pages → Source 选 GitHub Actions。
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
