[package]
name = "meowo-app"
version = "0.6.3"
edition = "2021"

# 全部 Rust 都住在 app/src-tauri 下:本包既是 Tauri 应用 crate,也是 workspace 根
# (根包自动是成员)。cargo 命令从本目录起跑;sidecar/CI/e2e 的 target 路径都按此假设。
[workspace]
members = [
    "crates/meowo-store",
    "crates/meowo-agent",
    "crates/meowo-protocol",
    "crates/meowo-reporter",
    "crates/meowo-setup",
]
resolver = "2"

# 安装包体积:此前没有任何 release 配置,主程序裸奔到 25MB——一半是可 strip 的符号
# 和未做 LTO 的跨 crate 重复代码。代价只是 release 编译变慢。
# 刻意**不设** panic = "abort":本应用靠线程隔离降级存活——PTY 读取/attach/watch 等
# 长驻后台线程里的 panic 只该死一个镜像线程,abort 会把所有托管会话一起带走;
# 全仓 ~20 处锁中毒恢复(unwrap_or_else(into_inner))也只在 unwind 语义下才有意义。
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
thiserror = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
notify = "6"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[lib]
name = "meowo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# E2E 测试专用：注入 WDIO 内嵌 WebDriver 服务器 + execute/mock/log 桥。仅 `--features e2e`
# 时编译进二进制；生产构建绝不包含（否则会把一个可远程驱动 app 的 WebDriver 端点 + 任意
# JS 执行/命令 mock 能力塞进发行版）。E2E 构建见 app/e2e/README.md。
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
meowo-agent = { path = "crates/meowo-agent" }
meowo-protocol = { path = "crates/meowo-protocol" }
meowo-store = { path = "crates/meowo-store" }
meowo-reporter = { path = "crates/meowo-reporter" }
# protocol-asset：对话页图片附件缩略图经 asset 协议加载本地图（scope 见 tauri.conf.json）。
tauri = { workspace = true, features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-dialog = "2"
# E2E 专用插件（feature=e2e 才编译）：tauri-plugin-wdio 提供 execute/mock/日志转发，
# tauri-plugin-wdio-webdriver 提供内嵌 WebDriver 服务器（embedded provider）。见 [features].
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
notify = { workspace = true }
# 剪贴板图像读写(原生图片附加:把附件写进剪贴板让 TUI 自己 Ctrl-V 读;发完还原快照)。
# image-data 提供 get_image/set_image;关默认特性是去掉 Linux 的 wayland-data-control 附带依赖。
arboard = { version = "3", default-features = false, features = ["image-data"] }
# 附件文件(图片)解码成 RGBA 喂给 arboard::set_image。tauri 的图标栈已引入该 crate,
# 这里只补声明、不新增依赖树。关默认特性只留常见剪贴板格式,控制编译面。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
percent-encoding = "2"
url = "2"
base64 = "0.22"
# 非 UTF-8 文本兜底解码（fsutil::decode_text_bytes）：中文 Windows 上 GBK 源码文件常见，
# diff/文件查看器无脑 lossy 会整屏 U+FFFD。只用 GBK 一档，不引入全量编码探测。
encoding_rs = "0.8"
# ureq 只服务 ports.rs 的 HttpPort 实现——插件层只认 trait，不依赖 HTTP 栈。
# socks-proxy：SOCKS 支持在 ureq 是**编译期 feature**，不开的话 `socks5://` 代理能解析、
# 但连接时才失败。Clash / V2Ray 用户用 socks5 是常态，必须开。
ureq = { version = "2", features = ["json", "socks-proxy"] }
# 直下安装要校验二进制的 SHA-256（Phase 3 曾随 codex setup 迁走，现因 run_direct_install 复用）
sha2 = "0.10"
# 系统语言检测（Settings.language = auto 时解析界面/通知语言）。
sys-locale = "0.3"
portable-pty = "0.9.0"
getrandom = "0.3"
vt100 = "0.16.2"
# 屏幕检测规则的行匹配（detect.rs）。手写谓词表达力不够时会被迫放宽或收窄规则——
# 实测已因此漏判过 codex 的多空格状态行、且漏掉了 kimi 审批行的 `?` 结尾约束。
# regex 本就在依赖树里（ureq/notify 等的传递依赖），提为直接依赖不增加编译体积。
regex = "1"
tauri-plugin-single-instance = "2.4.3"
# 远程访问桥（remote.rs）：局域网/Tailscale 内手机浏览器经 HTTP 使用对话页。
# axum 本就在依赖树（e2e 插件的传递依赖，lock 已锁 0.8.9），提为常驻不引新版本；
# 关默认特性只留用到的四项，控制 release（opt-level="s"）的体积增量。
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
# tokio 经 tauri 传递引入，但 tauri 默认不开 net（现由 updater→reqwest 链传递打开）——
# 远程桥的 TcpListener 依赖它，显式声明不把编译成败押在别人的依赖树上。
tokio = { version = "1", features = ["net", "sync"] }
# 远程目录浏览（remote.rs list_subdirectories）：std canonicalize 在 Windows 回 \\?\
# 前缀路径，展示难看且回填 cwd 后部分 agent 不认。已在依赖树（tauri 传递），零新增。
dunce = "1"
# codex config.toml 的结构保持编辑（保注释与键序）。kimi 的已迁入 meowo-agent::config。
# codex hook 预信任的 trusted_hash 计算（SHA-256）。

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_Security_Cryptography"] }
uiautomation = "0.25"
tauri-winrt-notification = "0.7"
# 点击 toast 后从"通知中心"移除本应用的已投递通知（tauri-winrt-notification 本身不暴露历史清除）。
# 版本与 tauri-winrt-notification 内部的 windows 0.61 对齐，避免拉入第二份 windows 副本。
# Win32_* 特性给 openwith.rs（「打开方式」枚举 + 图标提取）：COM/Shell/GDI/图标。
windows = { version = "0.61", features = [
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
] }
# 修正 auto-launch 写 Run 项时路径不加引号的问题（含空格路径会失败）：enable 后重写为带引号路径。
winreg = "0.55"
# 生产构建关 WebView2 浏览器加速键（window.rs disable_browser_accelerators）。
# tauri/wry 已传递依赖同版本（0.38.2，windows-core 0.61 系），提为直接依赖不引第二份副本。
webview2-com = "0.38"

[target.'cfg(target_os = "macos")'.dependencies]
# 钉 rev 不跟踪分支：lock 重建 / cargo update 不会静默拉到上游新提交（与 Cargo.lock 锁定提交一致）。
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "18ffb9a201fbf6fedfaa382fd4b92315ea30ab1a" }
mac-notification-sys = "0.6"
# 点击通知后从"通知中心"移除本应用的已投递通知（mac-notification-sys 不暴露移除接口）。
# objc2 与 tauri 生态现有 0.6 对齐（替换 2022 年后停维护的 objc 0.2）。
objc2 = "0.6"

[lints.rust]
# tauri-nspanel 的 panel_delegate! 宏展开含 #[cfg(feature = "cargo-clippy")]，新 rustc 下触发
# unexpected_cfgs；该 cfg 来自上游宏、无法在调用处消除，整体放行（仅影响本 crate）。
unexpected_cfgs = "allow"
