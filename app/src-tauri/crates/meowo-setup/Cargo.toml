# WebView2 壳安装器：无边框 wry 窗口渲染内嵌 HTML（与应用同一套设计 tokens），
# 收集安装选项后把内嵌的 NSIS 安装器（芯）释出到临时目录以 /S 静默运行。
# 不是 sidecar、不进 bundle：仅由 release CI 单独构建并作为额外 release asset 上传，
# updater 的 latest.json 仍指向 NSIS 芯。详见 ../../nsis/README.md 与本 crate 各文件头。
[package]
name = "meowo-setup"
# 无意义占位：真实版本由 build.rs 从 workspace 根（meowo-app）注入 MEOWO_APP_VERSION。
version = "0.0.0"
edition = "2021"
publish = false

# GUI 依赖全部锁在 Windows 目标下：CI 的 macos 矩阵跑 --workspace，
# 非 Windows 只编译 logic 纯逻辑（单测宿主）+ 空 main，零成本过编译。
# 版本与 Cargo.lock 现有解析对齐（wry/tao 与 tauri 2.11 同源），不引新审计面。
# build-dependencies 的 cfg 按 HOST 解析：mac CI 矩阵不装不编，Windows 构建机才用。
# embed-resource 3.x 已在 Cargo.lock（tauri-build 依赖链），零新增审计面。
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
wry = "0.55"
tao = "0.35"
rfd = "0.16"
winreg = "0.55"
semver = "1"
raw-window-handle = "0.6"
serde_json = { workspace = true }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_System_Environment",
    "Win32_UI_WindowsAndMessaging",
] }
